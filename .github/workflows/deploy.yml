
name: Deploy HTML Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Website
        run: |
          sudo cp -r ./* /var/www/html/
          sudo systemctl reload apache2

      - name: Deployment Success
        run: echo "Website deployed successfully!"
